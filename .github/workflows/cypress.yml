name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        id: cypress
        uses: cypress-io/github-action@v6
        continue-on-error: true
        with:
          browser: chrome
        env:
          NODE_VERSION: 20

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      # cypress-mochawesome-reporter already writes the final HTML report
      # (with embedded screenshots) to cypress/reports/html during the run
      # above - no separate "generate" step needed, just publish it.
      - name: Publish report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: cypress/reports/html

      - name: Add report link to run summary
        if: always()
        run: |
          {
            echo "## 📊 Test report"
            echo ""
            echo "[**Click here to view the full Mochawesome report**](https://peixooto.github.io/challengeAT/)"
            echo ""
            echo "_Might take a minute to update right after this run finishes._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if tests failed
        if: steps.cypress.outcome == 'failure'
        run: exit 1
